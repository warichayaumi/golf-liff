<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ผลคะแนน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --fairway: #1F4E3D; --fairway-deep: #12352A; --mist: #F3F6F1; --paper: #FFFFFF;
    --line: #D5DED6; --ink: #1B2420; --ink-soft: #55635B; --flag: #C8372D;
    --gold: #B88A1E; --silver: #7D8A92; --bronze: #A0643C;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fairway: #5FB08D; --fairway-deep: #0F2A21; --mist: #0E1512; --paper: #16201B;
      --line: #2C3A33; --ink: #E7EEE9; --ink-soft: #9DADA4; --flag: #E0574C;
      --gold: #E3B74C; --silver: #AEBAC1; --bronze: #D08B5C;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px; line-height: 1.55; color: var(--ink); background: var(--mist);
    padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
  }
  .card-head {
    background: var(--fairway-deep); color: #F3F6F1;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 22px 30px; position: relative;
  }
  .card-head::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 10px;
    background: radial-gradient(circle at 8px 10px, var(--mist) 5px, transparent 5.5px) repeat-x;
    background-size: 16px 10px;
  }
  .eyebrow { font-size: 13px; letter-spacing: 3px; color: #8FB8A5; text-transform: uppercase; margin: 0 0 6px; }
  h1 { font-family: "Noto Serif Thai", Georgia, serif; font-weight: 600; font-size: 27px; line-height: 1.3; margin: 0; }
  .sub { margin: 4px 0 0; color: #BFD3C7; font-size: 15px; }
  main { max-width: 640px; margin: 0 auto; padding: 14px 16px 0; }

  select {
    width: 100%; min-height: 48px; font: inherit; font-size: 16px; color: var(--ink);
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px;
  }
  .controls { display: grid; gap: 10px; margin: 4px 0 14px; }
  .seg { display: flex; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button {
    flex: 1; min-height: 42px; font: inherit; font-size: 15px; font-weight: 500; color: var(--ink-soft);
    background: transparent; border: 0; border-radius: 9px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--fairway); color: #FFFFFF; }

  .list { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row > button {
    width: 100%; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center;
    padding: 12px 14px; background: none; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  .rank { font-size: 18px; font-weight: 600; text-align: center; color: var(--ink-soft); }
  .rank.r1 { color: var(--gold); } .rank.r2 { color: var(--silver); } .rank.r3 { color: var(--bronze); }
  .rank.r1::after { content: ""; display: block; width: 14px; height: 3px; background: var(--flag); margin: 2px auto 0; border-radius: 2px; }
  .who { min-width: 0; }
  .who b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who small { color: var(--ink-soft); font-size: 13px; }
  .score { text-align: right; }
  .score b { display: block; font-size: 22px; font-weight: 600; line-height: 1.1; }
  .score small { color: var(--ink-soft); font-size: 12px; }

  .card { padding: 2px 14px 14px; }
  .grid-wrap { overflow-x: auto; }
  table.sc { border-collapse: collapse; width: 100%; min-width: 320px; font-size: 13px; text-align: center; }
  .sc th, .sc td { border: 1px solid var(--line); padding: 4px 2px; }
  .sc th { color: var(--ink-soft); font-weight: 500; background: var(--mist); }
  .sc td.sum, .sc th.sum { font-weight: 600; }
  .card p { margin: 8px 0 0; font-size: 13px; color: var(--ink-soft); }

  .foot { font-size: 13px; color: var(--ink-soft); margin: 14px 2px 0; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .foot button { font: inherit; font-size: 13px; color: var(--fairway); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  .empty { padding: 28px 16px; text-align: center; color: var(--ink-soft); }
  .state { text-align: center; padding: 56px 20px; color: var(--ink-soft); }
  .spinner {
    width: 32px; height: 32px; margin: 0 auto 16px; border: 3px solid var(--line); border-top-color: var(--fairway);
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="card-head">
  <p class="eyebrow">Leaderboard</p>
  <h1 id="title">ผลคะแนน</h1>
  <p class="sub" id="sub"></p>
</header>

<main>
  <section class="state" id="loading"><div class="spinner"></div><p>กำลังโหลดผลคะแนน</p></section>
  <section class="state" id="error" hidden><p id="error-msg"></p></section>

  <section id="board" hidden>
    <div class="controls">
      <select id="event-select" aria-label="เลือกรายการแข่ง"></select>
      <div class="seg" id="flight-seg" role="group" aria-label="Flight"></div>
      <div class="seg" id="mode-seg" role="group" aria-label="Gross หรือ Net">
        <button type="button" data-mode="gross">Gross</button>
        <button type="button" data-mode="net">Net</button>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="foot">
      <span id="foot-note"></span>
      <button type="button" id="share-btn">แชร์ลิงก์</button>
    </div>
  </section>
</main>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbwEGMSJRRfsSIHnNTgRV3E6POiUs5OatKj7MadewzYhXHqXg3Mnm0CfQQcyCQQY-kky/exec';

  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  let state = { event: params.get('event'), flight: params.get('flight'), mode: params.get('mode') === 'net' ? 'net' : 'gross' };
  let events = [];
  let data = null;
  let openRow = null;

  async function get(query) {
    const res = await fetch(API_URL + '?' + new URLSearchParams(query));
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'ระบบขัดข้อง');
    return json;
  }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function thaiDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return isNaN(d) ? iso : d.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  function syncUrl() {
    const q = new URLSearchParams();
    if (state.event) q.set('event', state.event);
    if (state.flight) q.set('flight', state.flight);
    q.set('mode', state.mode);
    history.replaceState(null, '', '?' + q.toString());
  }
  function fail(msg) {
    $('error-msg').textContent = msg;
    $('loading').hidden = true;
    $('board').hidden = true;
    $('error').hidden = false;
  }

  function flightLabel(f) { return f ? 'Flight ' + f : 'ยังไม่จัด'; }

  function render() {
    const ev = data.event;
    $('title').textContent = ev.name;
    $('sub').textContent = thaiDate(ev.date) + ' · ' + ev.course_name;
    document.title = 'ผลคะแนน · ' + ev.name;

    const flights = [...new Set(data.players.map(p => p.flight))].sort((a, b) => (a === '' ? 1 : b === '' ? -1 : a.localeCompare(b)));
    if (!flights.includes(state.flight)) state.flight = flights[0] !== undefined ? flights[0] : null;

    const seg = $('flight-seg');
    seg.textContent = '';
    seg.hidden = flights.length === 0;
    flights.forEach(f => {
      const b = el('button', '', flightLabel(f));
      b.type = 'button';
      b.setAttribute('aria-pressed', f === state.flight ? 'true' : 'false');
      b.onclick = () => { state.flight = f; openRow = null; render(); };
      seg.append(b);
    });
    document.querySelectorAll('#mode-seg button').forEach(b => {
      b.setAttribute('aria-pressed', b.dataset.mode === state.mode ? 'true' : 'false');
    });

    const list = $('list');
    list.textContent = '';
    const rankKey = state.mode === 'net' ? 'rank_net' : 'rank_gross';
    const rows = data.players
      .filter(p => p.flight === state.flight)
      .sort((a, b) => a[rankKey] - b[rankKey] || a.name.localeCompare(b.name));

    if (!rows.length) {
      list.append(el('div', 'empty', 'ยังไม่มีสกอร์ที่แอดมินอนุมัติในรายการนี้'));
    }

    rows.forEach((p, idx) => {
      const row = el('div', 'row');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.setAttribute('aria-expanded', openRow === p.name ? 'true' : 'false');
      const r = p[rankKey];
      const tied = rows.some(o => o !== p && o[rankKey] === r);
      btn.append(el('span', 'rank' + (r <= 3 ? ' r' + r : ''), (tied ? 'T' : '') + r));
      const who = el('span', 'who');
      who.append(el('b', '', p.name), el('small', '', p.clubs.join(' · ') || ' '));
      const score = el('span', 'score');
      score.append(
        el('b', '', String(state.mode === 'net' ? p.net : p.gross)),
        el('small', '', state.mode === 'net' ? 'Gross ' + p.gross + ' · HC ' + (p.handicap ?? '–') : 'OUT ' + p.out + ' · IN ' + p.in),
      );
      btn.append(who, score);
      btn.onclick = () => { openRow = openRow === p.name ? null : p.name; render(); };
      row.append(btn);

      if (openRow === p.name) row.append(scorecard(p));
      list.append(row);
    });

    $('foot-note').textContent = 'นับเฉพาะสกอร์ที่อนุมัติแล้ว' + (state.mode === 'net' ? ' · Net ใช้ handicap ' + data.allowance + '%' : '');
    syncUrl();
  }

  function scorecard(p) {
    const card = el('div', 'card');
    const wrap = el('div', 'grid-wrap');
    const t = el('table', 'sc');
    const half = (start, label, total) => {
      const head = el('tr');
      const body = el('tr');
      for (let i = start; i < start + 9; i++) {
        head.append(el('th', '', String(i + 1)));
        body.append(el('td', '', String(p.holes[i])));
      }
      head.append(el('th', 'sum', label));
      body.append(el('td', 'sum', String(total)));
      t.append(head, body);
    };
    half(0, 'OUT', p.out);
    half(9, 'IN', p.in);
    wrap.append(t);
    card.append(wrap);
    card.append(el('p', '', 'Gross ' + p.gross + ' · Handicap ' + (p.handicap ?? '–') + ' · Net ' + p.net));
    return card;
  }

  async function loadEvent(eventId) {
    $('list').textContent = '';
    $('list').append(el('div', 'empty', 'กำลังโหลด'));
    try {
      data = await get({ action: 'leaderboard', event: eventId });
      state.event = eventId;
      openRow = null;
      render();
    } catch (err) {
      fail(err.message);
    }
  }

  async function main() {
    try {
      events = (await get({ action: 'events' })).events;
      if (!events.length) return fail('ยังไม่มีรายการแข่ง');

      const select = $('event-select');
      events.forEach(ev => {
        const o = el('option', '', ev.name + ' · ' + thaiDate(ev.date));
        o.value = ev.event_id;
        select.append(o);
      });
      const fallback = events.find(ev => ev.approved_count > 0) || events[0];
      const initial = events.some(ev => ev.event_id === state.event) ? state.event : fallback.event_id;
      select.value = initial;
      select.onchange = () => { state.flight = null; loadEvent(select.value); };

      document.querySelectorAll('#mode-seg button').forEach(b => {
        b.onclick = () => { state.mode = b.dataset.mode; render(); };
      });
      $('share-btn').onclick = async () => {
        const url = location.href;
        try {
          if (navigator.share) await navigator.share({ title: document.title, url });
          else { await navigator.clipboard.writeText(url); $('share-btn').textContent = 'คัดลอกลิงก์แล้ว'; }
        } catch (e) { /* user cancelled */ }
      };

      $('loading').hidden = true;
      $('board').hidden = false;
      await loadEvent(initial);
    } catch (err) {
      fail(err.message || 'โหลดไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง');
    }
  }
  main();
</script>
</body>
</html>
