<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ลงทะเบียนสมาชิก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --fairway: #1F4E3D;
    --fairway-deep: #12352A;
    --mist: #F3F6F1;
    --paper: #FFFFFF;
    --line: #D5DED6;
    --ink: #1B2420;
    --ink-soft: #55635B;
    --flag: #C8372D;
    --danger: #B3261E;
    --danger-bg: #FBEAE8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fairway: #5FB08D;
      --fairway-deep: #0F2A21;
      --mist: #0E1512;
      --paper: #16201B;
      --line: #2C3A33;
      --ink: #E7EEE9;
      --ink-soft: #9DADA4;
      --flag: #E0574C;
      --danger: #F2A49C;
      --danger-bg: #3A1B18;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.6;
    color: var(--ink);
    background: var(--mist);
    padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  }

  .card-head {
    background: var(--fairway-deep);
    color: #F3F6F1;
    padding: calc(28px + env(safe-area-inset-top, 0px)) 24px 30px;
    position: relative;
  }
  .card-head::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 10px;
    background: radial-gradient(circle at 8px 10px, var(--mist) 5px, transparent 5.5px) repeat-x;
    background-size: 16px 10px;
  }
  .pin {
    display: inline-block;
    width: 2px; height: 30px;
    background: #F3F6F1;
    position: relative;
    margin-bottom: 14px;
  }
  .pin::after {
    content: "";
    position: absolute;
    left: 2px; top: 0;
    border-left: 18px solid var(--flag);
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
  }
  h1 {
    font-family: "Noto Serif Thai", Georgia, serif;
    font-weight: 600;
    font-size: 30px;
    line-height: 1.3;
    margin: 0;
  }
  .greet { margin: 6px 0 0; color: #BFD3C7; font-size: 16px; }

  main { max-width: 560px; margin: 0 auto; padding: 8px 20px 0; }

  fieldset { border: 0; margin: 28px 0 0; padding: 0; }
  legend {
    font-weight: 600;
    font-size: 15px;
    color: var(--fairway);
    padding: 0 0 10px;
    border-bottom: 1px solid var(--line);
    width: 100%;
    margin-bottom: 16px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { margin-bottom: 16px; }
  label.lbl { display: block; font-size: 15px; font-weight: 500; margin-bottom: 6px; }
  .opt { color: var(--ink-soft); font-weight: 400; }
  input[type=text], input[type=tel], input[type=number], input[type=date], textarea {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    min-height: 50px;
    appearance: none;
    -webkit-appearance: none;
  }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--fairway); outline-offset: 1px; border-color: transparent; }
  .hint { font-size: 14px; color: var(--ink-soft); margin: 6px 0 0; }

  .segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice input, .club input { position: absolute; opacity: 0; pointer-events: none; }
  .choice span, .club span {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 50px; padding: 10px 14px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
  }
  .choice input:checked + span, .club input:checked + span {
    background: var(--fairway);
    border-color: var(--fairway);
    color: #FFFFFF;
    font-weight: 500;
  }
  .choice input:focus-visible + span, .club input:focus-visible + span { outline: 2px solid var(--fairway); outline-offset: 2px; }
  .choice, .club { position: relative; display: block; }

  .clubs { display: grid; gap: 10px; }
  .club span { justify-content: flex-start; text-align: left; }
  .club span::before {
    content: "";
    flex: none;
    width: 20px; height: 20px;
    border: 1.5px solid var(--line);
    border-radius: 6px;
    background: var(--paper);
  }
  .club input:checked + span::before {
    border-color: #FFFFFF;
    background: #FFFFFF;
    box-shadow: inset 0 0 0 4px var(--fairway);
  }

  .consent { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; color: var(--ink-soft); }
  .consent input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--fairway); flex: none; }
  .consented { font-size: 15px; color: var(--ink-soft); margin: 0; }

  .alert {
    background: var(--danger-bg);
    color: var(--danger);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    margin: 20px 0 0;
  }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--paper);
    border-top: 1px solid var(--line);
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .bar-inner { max-width: 560px; margin: 0 auto; }
  button.primary {
    width: 100%;
    min-height: 54px;
    font: inherit;
    font-weight: 600;
    color: #FFFFFF;
    background: var(--fairway);
    border: 0;
    border-radius: 12px;
    cursor: pointer;
  }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  button.primary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .state { text-align: center; padding: 64px 24px; color: var(--ink-soft); }
  .state h2 { font-family: "Noto Serif Thai", Georgia, serif; color: var(--ink); font-size: 24px; margin: 0 0 8px; }
  .state p { margin: 0 0 24px; }
  .spinner {
    width: 32px; height: 32px; margin: 0 auto 16px;
    border: 3px solid var(--line); border-top-color: var(--fairway);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header class="card-head">
  <div class="pin" aria-hidden="true"></div>
  <h1 id="title">ลงทะเบียนสมาชิก</h1>
  <p class="greet" id="greet">กำลังเชื่อมต่อกับ LINE</p>
</header>

<main>
  <section class="state" id="loading">
    <div class="spinner" aria-hidden="true"></div>
    <p>กำลังโหลดข้อมูล</p>
  </section>

  <section class="state" id="fatal" hidden>
    <h2>เปิดหน้านี้ไม่สำเร็จ</h2>
    <p id="fatal-msg"></p>
    <button class="primary" type="button" onclick="location.reload()">ลองอีกครั้ง</button>
  </section>

  <section class="state" id="done" hidden>
    <h2 id="done-title">ลงทะเบียนเรียบร้อย</h2>
    <p>กลับไปที่แชทได้เลย แก้ไขข้อมูลได้ทุกเมื่อจากเมนูเดิม</p>
    <button class="primary" type="button" id="close-btn">กลับไปที่แชท</button>
  </section>

  <form id="form" novalidate hidden>
    <fieldset>
      <legend>ข้อมูลส่วนตัว</legend>
      <div class="row">
        <div class="field">
          <label class="lbl" for="first_name">ชื่อ</label>
          <input type="text" id="first_name" name="first_name" autocomplete="given-name" required>
        </div>
        <div class="field">
          <label class="lbl" for="last_name">นามสกุล</label>
          <input type="text" id="last_name" name="last_name" autocomplete="family-name" required>
        </div>
      </div>
      <div class="field">
        <label class="lbl" for="nickname">ชื่อเล่น <span class="opt">(ไม่บังคับ)</span></label>
        <input type="text" id="nickname" name="nickname" autocomplete="nickname">
      </div>
      <div class="field">
        <span class="lbl" id="sex-label">เพศ</span>
        <div class="segmented" role="radiogroup" aria-labelledby="sex-label">
          <label class="choice"><input type="radio" name="sex" value="Male" required><span>ชาย</span></label>
          <label class="choice"><input type="radio" name="sex" value="Female"><span>หญิง</span></label>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label class="lbl" for="date_of_birth">วันเกิด</label>
          <input type="date" id="date_of_birth" name="date_of_birth" required>
        </div>
        <div class="field">
          <label class="lbl" for="handicap">Handicap</label>
          <input type="number" id="handicap" name="handicap" inputmode="decimal" step="0.1" min="-10" max="54" required>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>ติดต่อ</legend>
      <div class="field">
        <label class="lbl" for="mobile">เบอร์มือถือ</label>
        <input type="tel" id="mobile" name="mobile" inputmode="numeric" autocomplete="tel" placeholder="0812345678" required>
      </div>
      <div class="field">
        <label class="lbl" for="address">ที่อยู่</label>
        <textarea id="address" name="address" autocomplete="street-address" required></textarea>
      </div>
    </fieldset>

    <fieldset>
      <legend>ชมรมที่สังกัด</legend>
      <p class="hint" style="margin:-6px 0 12px">เลือกได้มากกว่าหนึ่งชมรม</p>
      <div class="clubs" id="clubs"></div>
    </fieldset>

    <fieldset id="consent-block">
      <legend>ข้อมูลส่วนบุคคล</legend>
      <label class="consent">
        <input type="checkbox" id="pdpa_consent">
        <span>ยินยอมให้ชมรมเก็บและใช้ข้อมูลข้างต้นเพื่อจัดการสมาชิกและการแข่งขันเท่านั้น</span>
      </label>
    </fieldset>
    <p class="consented" id="consented-note" hidden>คุณให้ความยินยอมเรื่องข้อมูลส่วนบุคคลไว้แล้วตอนลงทะเบียน</p>

    <div class="alert" id="form-error" role="alert" hidden></div>

    <div class="bar">
      <div class="bar-inner">
        <button class="primary" type="submit" id="save-btn">ลงทะเบียน</button>
      </div>
    </div>
  </form>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  const LIFF_ID = '2012286082-glvQWKco';
  const API_URL = 'https://script.google.com/macros/s/AKfycbwEGMSJRRfsSIHnNTgRV3E6POiUs5OatKj7MadewzYhXHqXg3Mnm0CfQQcyCQQY-kky/exec';

  const $ = id => document.getElementById(id);
  let state = { registered: false, consented: false };

  async function api(action, data) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, idToken: liff.getIDToken(), data }),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'ระบบขัดข้อง');
    return json;
  }

  function show(id) {
    ['loading', 'fatal', 'done', 'form'].forEach(s => { $(s).hidden = s !== id; });
  }

  function fatal(msg) {
    $('fatal-msg').textContent = msg;
    show('fatal');
  }

  function renderClubs(clubs, selected) {
    const box = $('clubs');
    box.textContent = '';
    clubs.forEach(c => {
      const label = document.createElement('label');
      label.className = 'club';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.name = 'club_ids';
      input.value = c.id;
      input.checked = selected.includes(c.id);
      const span = document.createElement('span');
      span.textContent = c.name;
      label.append(input, span);
      box.append(label);
    });
  }

  function fill(m) {
    ['first_name', 'last_name', 'nickname', 'date_of_birth', 'mobile', 'address'].forEach(k => { $(k).value = m[k] || ''; });
    $('handicap').value = m.handicap === '' || m.handicap == null ? '' : m.handicap;
    const sex = document.querySelector('input[name=sex][value="' + m.sex + '"]');
    if (sex) sex.checked = true;
  }

  function collect() {
    const f = $('form');
    return {
      first_name: f.first_name.value,
      last_name: f.last_name.value,
      nickname: f.nickname.value,
      sex: (f.querySelector('input[name=sex]:checked') || {}).value || '',
      date_of_birth: f.date_of_birth.value,
      handicap: f.handicap.value,
      mobile: f.mobile.value,
      address: f.address.value,
      club_ids: [...f.querySelectorAll('input[name=club_ids]:checked')].map(i => i.value),
      pdpa_consent: $('pdpa_consent').checked,
    };
  }

  function clientCheck(d) {
    if (!d.first_name.trim() || !d.last_name.trim()) return 'กรอกชื่อและนามสกุล';
    if (!d.sex) return 'เลือกเพศ';
    if (!d.date_of_birth) return 'ระบุวันเกิด';
    if (d.handicap === '' || isNaN(Number(d.handicap))) return 'กรอก Handicap เป็นตัวเลข';
    if (!/^0\d{8,9}$/.test(d.mobile.replace(/[\s-]/g, ''))) return 'เบอร์มือถือต้องขึ้นต้นด้วย 0 และมี 9–10 หลัก';
    if (!d.address.trim()) return 'กรอกที่อยู่';
    if (!d.club_ids.length) return 'เลือกชมรมอย่างน้อย 1 ชมรม';
    if (!state.consented && !d.pdpa_consent) return 'กรุณายอมรับการเก็บข้อมูลส่วนบุคคลก่อนบันทึก';
    return '';
  }

  function formError(msg) {
    const el = $('form-error');
    el.textContent = msg;
    el.hidden = !msg;
    if (msg) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  async function onSubmit(e) {
    e.preventDefault();
    const data = collect();
    const problem = clientCheck(data);
    if (problem) return formError(problem);
    formError('');

    const btn = $('save-btn');
    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'กำลังบันทึก';
    try {
      await api('saveProfile', data);
      $('done-title').textContent = state.registered ? 'บันทึกการแก้ไขแล้ว' : 'ลงทะเบียนเรียบร้อย';
      $('title').textContent = state.registered ? 'แก้ไขข้อมูลสมาชิก' : 'ลงทะเบียนสมาชิก';
      show('done');
      window.scrollTo(0, 0);
    } catch (err) {
      formError(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = label;
    }
  }

  async function main() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: location.href });
        return;
      }
      const res = await api('getProfile');
      state.registered = res.registered;
      state.consented = Boolean(res.member && res.member.consented);

      $('greet').textContent = res.displayName ? 'สวัสดีคุณ ' + res.displayName : '';
      if (res.registered) {
        $('title').textContent = 'แก้ไขข้อมูลสมาชิก';
        $('save-btn').textContent = 'บันทึกการแก้ไข';
        fill(res.member);
      }
      renderClubs(res.clubs, res.registered ? res.member.club_ids : []);
      $('consent-block').hidden = state.consented;
      $('consented-note').hidden = !state.consented;

      show('form');
    } catch (err) {
      fatal(err.message || 'เชื่อมต่อไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง');
    }
  }

  $('form').addEventListener('submit', onSubmit);
  $('close-btn').addEventListener('click', () => {
    if (liff.isInClient()) liff.closeWindow();
    else window.close();
  });
  main();
</script>
</body>
</html>
